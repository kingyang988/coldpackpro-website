<svg viewBox="0 0 820 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ColdPackPro transparent logo</title>
  <desc id="desc">Transparent horizontal logo for ColdPackPro with subtitle Cold Chain Solutions.</desc>
  <defs>
    <linearGradient id="proGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g transform="translate(20 16)">
    <text x="0" y="76"
      fill="#0F172A"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="78"
      font-weight="800"
      letter-spacing="1.5">COLD PACK</text>

    <text x="560" y="76"
      fill="url(#proGradient)"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="78"
      font-weight="800"
      letter-spacing="1.5">PRO</text>

    <text x="350" y="132"
      text-anchor="middle"
      fill="#64748B"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="28"
      font-weight="500"
      letter-spacing="3">Cold Chain Solutions</text>
  </g>
</svg>
